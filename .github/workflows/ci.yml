name: Continuous Integration

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # Job 1: Memeriksa kerapian dan standar penulisan kode PHP
  lint-code:
    name: Code Quality & Style (Laravel Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint Linter Check
        run: ./vendor/bin/pint --test

  # Job 2: Menjalankan pengujian otomatis aplikasi web
  run-tests:
    name: Automated Unit & Feature Tests (PHPUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PNPM Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Frontend Assets (Vite)
        run: pnpm run build

      - name: Prepare Application Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit Test Suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test
